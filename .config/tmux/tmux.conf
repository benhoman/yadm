# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# set default terminal mode to 256 colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# allow focus events to get through to applications running in tmux
set -g focus-events on

# use vi keys
set-window-option -g mode-keys vi

# set -g default-shell /usr/bin/fish
set -g history-limit 50000
set -g renumber-windows on
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."
setw -g automatic-rename

# Allows for faster key repetition
set -s escape-time 0

setw -g aggressive-resize on

set -g base-index 1
set -g pane-base-index 1

# Navigate panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2

# Copy/Paste
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'command -v wl-copy >/dev/null && wl-copy || xclip -in -selection clipboard'

run-shell 'V=$(tmux -V | cut -d" " -f2); tmux set-environment -g TMUX_VERSION_MAJOR $(echo $V | cut -d. -f1 | sed "s/[^0-9]*//g") && tmux set-environment -g TMUX_VERSION_MINOR $(echo $V | cut -d. -f2 | sed "s/[^0-9]*//g")'

bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# Popups
bind -n M-g display-popup -E "tmux new-session -A -s scratch"
# bind s display-popup -E -d "#{pane_current_path}" "git status && sleep 5" # show git status
# bind s run-shell ~/.config/tmux/scripts/tmux-session-menu
    # tmux list-sessions -F '#{?session_attached,,#{session_name}}' |
bind s display-popup -h 75% -w 90% -E "\
    tmux list-sessions -F '#S' |\
    grep -vx \"$(tmux display-message -p '#S')\" |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}'  |\
    xargs tmux switch-client -t"


# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'


## TPM
# bootstrap
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
    "run 'mkdir -p ~/.local/share/tmux/plugins && git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

run '~/.local/share/tmux/plugins/tpm/tpm'
